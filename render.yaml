services:
  - type: web
    name: daybook-todo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: taskmanager-edesmond817-ddaf.i.aivencloud.com
      - key: DB_PORT
        value: "19935"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_CA_CERT
        sync: false